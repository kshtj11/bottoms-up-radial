<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=540, user-scalable=no">
<title>Gesture Interaction Test — Radial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #frame {
    position: relative;
    width: 540px;
    height: 620px;
    overflow: hidden;
    background: #373737;
    background: color(display-p3 0.216 0.216 0.216);
  }

  /* Full-screen app view */
  #app-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #app-screen.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Recents view */
  #recents-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 30;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 160px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }

  #recents-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #recents-empty {
    color: rgba(255,255,255,0.4);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 180px;
  }

  #recents-cards {
    display: flex;
    align-items: center;
    align-self: flex-start;
    gap: 16px;
    overflow: visible;
    will-change: transform;
  }

  .recent-card {
    width: 280px;
    height: 360px;
    border-radius: 16px;
    flex: none;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    will-change: transform;
  }

  /* The handle */
  #dot-indicator {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    height: 48px;
    z-index: 50;
    transition: opacity 0.2s ease;
    pointer-events: auto;
    cursor: grab;
  }

  #dot-indicator.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Radial menu */
  #radial-container {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    z-index: 45;
    pointer-events: none;
  }

  #radial-bg {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) scale(0.3);
    transform-origin: center bottom;
    width: 275px;
    height: 138px;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }

  #radial-bg.visible {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  .radial-icon {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 21px;
    transform: translate(-50%, -50%) scale(0);
    transition: transform 0.2s ease, opacity 0.2s ease;
    opacity: 0;
    pointer-events: auto;
  }

  .radial-icon.visible {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }

  .radial-icon.hovered {
    transform: translate(-50%, -50%) scale(1.4);
  }

  .radial-icon .search-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  .app-icon {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    flex: none;
    transition: transform 0.15s ease;
    position: relative;
  }

  .search-svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Home screen */
  #home-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .home-icon {
    position: absolute;
    width: 56px;
    height: 56px;
    background: #D9D9D9;
    background: color(display-p3 0.851 0.851 0.851);
    border-radius: 8px;
  }

  #home-label {
    position: absolute;
    width: 276px;
    left: 136px;
    top: 496px;
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-weight: 500;
    font-size: 16px;
    line-height: 19px;
    text-align: center;
    color: #FFFFFF;
    color: color(display-p3 1.000 1.000 1.000);
  }
</style>
</head>
<body>

<div id="frame">
  <!-- Home screen -->
  <div id="home-screen">
    <div class="home-icon" style="left:78px;top:88px"></div>
    <div class="home-icon" style="left:187px;top:88px"></div>
    <div class="home-icon" style="left:296px;top:88px"></div>
    <div class="home-icon" style="left:405px;top:88px"></div>
    <div class="home-icon" style="left:78px;top:193px"></div>
    <div class="home-icon" style="left:187px;top:193px"></div>
    <div class="home-icon" style="left:296px;top:193px"></div>
    <div class="home-icon" style="left:405px;top:193px"></div>
    <div class="home-icon" style="left:78px;top:294px"></div>
    <div class="home-icon" style="left:187px;top:294px"></div>
    <div class="home-icon" style="left:296px;top:294px"></div>
    <div class="home-icon" style="left:405px;top:294px"></div>
    <div class="home-icon" style="left:78px;top:399px"></div>
    <div class="home-icon" style="left:187px;top:399px"></div>
    <div class="home-icon" style="left:296px;top:399px"></div>
    <div class="home-icon" style="left:405px;top:399px"></div>
    <div id="home-label">home screen with something and all</div>
  </div>

  <!-- Full screen app view -->
  <div id="app-screen"></div>

  <!-- Recents overlay -->
  <div id="recents-overlay">
    <div id="recents-empty">No recent apps</div>
    <div id="recents-cards"></div>
  </div>

  <!-- Handle -->
  <div id="dot-indicator">
    <svg width="96" height="48" viewBox="0 0 96 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path opacity="0.44" d="M48 0C74.5097 0 96 21.4903 96 48H0C0 21.4903 21.4903 0 48 0Z" fill="#4A4A4A" style="fill:#4A4A4A;fill:color(display-p3 0.2885 0.2885 0.2885);fill-opacity:1;"/>
      <path d="M48 18C64.5685 18 78 31.4315 78 48H18C18 31.4315 31.4315 18 48 18Z" fill="#D9D9D9" style="fill:#D9D9D9;fill:color(display-p3 0.8510 0.8510 0.8510);fill-opacity:1;"/>
    </svg>
  </div>

  <!-- Radial menu (swipe-up quick access) -->
  <div id="radial-container">
    <!-- Semi-circle background -->
    <svg id="radial-bg" viewBox="0 0 320 160" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M160 160C160 160 320 160 320 160C320 71.6 248.4 0 160 0C71.6 0 0 71.6 0 160L160 160Z" fill="#D9D9D9" fill-opacity="0.32"/>
      <!-- Inner cutout -->
      <path d="M160 160C160 160 220 160 220 160C220 126.9 193.1 100 160 100C126.9 100 100 126.9 100 160L160 160Z" fill="#373737" fill-opacity="1"/>
    </svg>
    <!-- Radial icons positioned along the arc -->
    <div class="radial-icon" id="r-search" data-color="#DADADA" style="background:#DADADA">
      <svg class="search-svg" width="20" height="20" viewBox="0 0 22 22" fill="none">
        <circle cx="9.5" cy="9.5" r="7" stroke="white" stroke-width="2.5" fill="none"/>
        <line x1="14.5" y1="14.5" x2="20" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="radial-icon" id="r-orange" data-color="#FF9F43" style="background:#FF9F43"></div>
    <div class="radial-icon" id="r-blue" data-color="#54A0FF" style="background:#54A0FF"></div>
    <div class="radial-icon" id="r-red" data-color="#FF6B6B" style="background:#FF6B6B"></div>
    <div class="radial-icon" id="r-teal" data-color="#1DD1A1" style="background:#1DD1A1"></div>
  </div>
</div>

<script>
const frame = document.getElementById('frame');
const dotIndicator = document.getElementById('dot-indicator');
const radialBg = document.getElementById('radial-bg');
const radialContainer = document.getElementById('radial-container');
const radialIcons = document.querySelectorAll('.radial-icon');
const appScreen = document.getElementById('app-screen');
const recentsOverlay = document.getElementById('recents-overlay');
const recentsCards = document.getElementById('recents-cards');
const recentsEmpty = document.getElementById('recents-empty');

const CARD_W = 280;
const CARD_GAP = 16;
const FRAME_W = 540;
const CENTER_OFFSET = (FRAME_W - CARD_W) / 2;

// Radial layout: icons on a semi-circle arc
// Center = bottom-center of frame (270, 620)
// Radius = 130px, spread from 180° (left) to 0° (right)
const ARC_RADIUS = 106;
const ARC_CENTER_X = 0; // relative to radial-container (which is at center-bottom)
const ARC_CENTER_Y = 0;
const ICON_COUNT = 5;

// Position icons along the arc (160° to 20°, i.e. left to right, all above bottom)
function positionRadialIcons() {
  const angles = [];
  for (let i = 0; i < ICON_COUNT; i++) {
    // Spread from 160° to 20° — keeps all icons above the origin
    const angle = 160 - (i * 140 / (ICON_COUNT - 1));
    angles.push(angle * Math.PI / 180);
  }
  radialIcons.forEach((icon, i) => {
    const x = ARC_CENTER_X + ARC_RADIUS * Math.cos(angles[i]);
    const y = ARC_CENTER_Y - ARC_RADIUS * Math.sin(angles[i]);
    icon.style.left = `${x}px`;
    icon.style.top = `${y}px`;
    icon.dataset.angle = angles[i];
  });
}

positionRadialIcons();

let state = 'idle';
let dragStartY = 0;
let currentHovered = null;
let peakDy = 0;
let recentsCardIndex = 0;
let runningApps = [];

function addToRunning(color) {
  runningApps = runningApps.filter(c => c !== color);
  runningApps.push(color);
  rebuildRecentsCards();
}

function rebuildRecentsCards() {
  recentsCards.innerHTML = '';
  if (runningApps.length === 0) {
    recentsEmpty.style.display = '';
    return;
  }
  recentsEmpty.style.display = 'none';
  runningApps.forEach(color => {
    const card = document.createElement('div');
    card.className = 'recent-card';
    card.dataset.color = color;
    card.style.background = color;
    recentsCards.appendChild(card);
  });
}

function setCardsTransform(offset, animate) {
  if (animate) {
    recentsCards.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  } else {
    recentsCards.style.transition = 'none';
  }
  recentsCards.style.transform = `translateX(${offset}px)`;
}

function getCardOffset(index) {
  return CENTER_OFFSET - (index * (CARD_W + CARD_GAP));
}

function showRadial() {
  radialBg.classList.add('visible');
  radialIcons.forEach((icon, i) => {
    setTimeout(() => icon.classList.add('visible'), i * 30);
  });
}

function hideRadial(animate) {
  if (animate) {
    radialBg.classList.remove('visible');
    radialIcons.forEach(icon => icon.classList.remove('visible'));
  } else {
    radialBg.classList.remove('visible');
    radialIcons.forEach(icon => icon.classList.remove('visible'));
  }
}

// Handle drag (swipe up from handle)
dotIndicator.addEventListener('pointerdown', (e) => {
  if (state !== 'idle' && state !== 'app-open') return;
  e.preventDefault();

  const wasAppOpen = state === 'app-open';
  state = 'dragging';
  dragStartY = e.clientY;
  peakDy = 0;

  dotIndicator.classList.add('hidden');
  showRadial();

  frame.setPointerCapture(e.pointerId);

  let recentsShown = false;

  const onMove = (e2) => {
    if (state !== 'dragging') return;
    const dy = dragStartY - e2.clientY;
    if (dy > peakDy) peakDy = dy;

    if (dy > 100 && !recentsShown) {
      recentsShown = true;
      showRecents();
    }

    if (recentsShown && dy < 60) {
      recentsShown = false;
      recentsOverlay.classList.remove('visible');
    }

    // Hit-test radial icons
    const containerRect = radialContainer.getBoundingClientRect();
    const originX = containerRect.left;
    const originY = containerRect.top;
    const pointerX = e2.clientX;
    const pointerY = e2.clientY;

    let hoveredIcon = null;
    radialIcons.forEach(icon => {
      const rect = icon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.sqrt((pointerX - cx) ** 2 + (pointerY - cy) ** 2);
      if (dist < 30) hoveredIcon = icon;
    });

    if (currentHovered && currentHovered !== hoveredIcon) {
      currentHovered.classList.remove('hovered');
    }
    if (hoveredIcon) {
      hoveredIcon.classList.add('hovered');
    }
    currentHovered = hoveredIcon;
  };

  const onUp = (e2) => {
    frame.removeEventListener('pointermove', onMove);
    frame.removeEventListener('pointerup', onUp);

    const dy = dragStartY - e2.clientY;

    if (currentHovered) {
      const color = currentHovered.dataset.color;
      recentsOverlay.classList.remove('visible');
      currentHovered.classList.remove('hovered');
      currentHovered = null;
      hideRadial(true);
      openApp(color);
    } else if (dy > 300) {
      hideRadial(true);
      goHome();
    } else if (recentsShown && dy > 60) {
      // Keep radial visible in recents view
      dotIndicator.classList.remove('hidden');
      state = 'recents';
    } else if (!wasAppOpen && peakDy < 10 && runningApps.length > 0) {
      hideRadial(true);
      const lastColor = runningApps[runningApps.length - 1];
      openApp(lastColor);
    } else {
      hideRadial(true);
      recentsOverlay.classList.remove('visible');
      dotIndicator.classList.remove('hidden');
      state = wasAppOpen ? 'app-open' : 'idle';
    }
  };

  frame.addEventListener('pointermove', onMove);
  frame.addEventListener('pointerup', onUp);
});

function openApp(color) {
  addToRunning(color);
  appScreen.style.background = color;
  appScreen.classList.add('open');
  dotIndicator.classList.remove('hidden');
  state = 'app-open';
}

function goHome() {
  appScreen.classList.remove('open');
  recentsOverlay.classList.remove('visible');
  dotIndicator.classList.remove('hidden');
  state = 'idle';
}

function showRecents() {
  rebuildRecentsCards();
  recentsCardIndex = Math.max(0, runningApps.length - 1);
  setCardsTransform(getCardOffset(recentsCardIndex), false);
  recentsOverlay.classList.add('visible');
  showRadial();
  dotIndicator.classList.remove('hidden');
  appScreen.classList.remove('open');
}

function hideRecents() {
  recentsOverlay.classList.remove('visible');
  hideRadial(true);
  dotIndicator.classList.remove('hidden');
  state = 'idle';
}

// Smooth recents swiping
recentsOverlay.addEventListener('pointerdown', (e) => {
  if (state !== 'recents') return;
  e.preventDefault();

  const card = e.target.closest('.recent-card');

  let startX = e.clientX;
  let lastX = startX;
  let lastTime = Date.now();
  let velocity = 0;

  recentsCards.style.transition = 'none';
  recentsOverlay.setPointerCapture(e.pointerId);

  const baseOffset = getCardOffset(recentsCardIndex);

  const onMove = (e2) => {
    const now = Date.now();
    const dx = e2.clientX - startX;
    const dt = now - lastTime;
    if (dt > 0) velocity = (e2.clientX - lastX) / dt;
    lastX = e2.clientX;
    lastTime = now;

    let rawOffset = baseOffset + dx;
    const maxOffset = getCardOffset(0);
    const minOffset = getCardOffset(runningApps.length - 1);
    if (rawOffset > maxOffset) rawOffset = maxOffset + (rawOffset - maxOffset) * 0.3;
    else if (rawOffset < minOffset) rawOffset = minOffset + (rawOffset - minOffset) * 0.3;

    recentsCards.style.transform = `translateX(${rawOffset}px)`;
  };

  const onUp = (e2) => {
    recentsOverlay.removeEventListener('pointermove', onMove);
    recentsOverlay.removeEventListener('pointerup', onUp);

    const dx = e2.clientX - startX;
    const cardCount = runningApps.length;

    if (Math.abs(dx) < 10) {
      if (card) { hideRecents(); openApp(card.dataset.color); return; }
      hideRecents();
      return;
    }

    const threshold = 40;
    let dir = 0;
    if (Math.abs(dx) > threshold) dir = dx < 0 ? 1 : -1;
    else if (Math.abs(velocity) > 0.3) dir = velocity < 0 ? 1 : -1;

    if (dir > 0) recentsCardIndex = Math.min(cardCount - 1, recentsCardIndex + 1);
    else if (dir < 0) recentsCardIndex = Math.max(0, recentsCardIndex - 1);

    setCardsTransform(getCardOffset(recentsCardIndex), true);
  };

  recentsOverlay.addEventListener('pointermove', onMove);
  recentsOverlay.addEventListener('pointerup', onUp);
});

// Init
runningApps = ['#E8A87C', '#85CDCA', '#C38D9E'];
rebuildRecentsCards();
</script>

</body>
</html>
